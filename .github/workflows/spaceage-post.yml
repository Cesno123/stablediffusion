name: SpaceAge post

on:
  schedule:
    # every 3 hours at :07 UTC (Berlin: 01:07, 04:07, ... in winter)
    - cron: "7 */3 * * *"
  workflow_dispatch:
  # A push to the posting code only runs the read-only access check below.
  push:
    paths:
      - "spaceage/post_instagram.py"
      - "spaceage/post_queue.py"
      - ".github/workflows/spaceage-post.yml"

permissions:
  contents: write  # move posted files out of the queue

concurrency:
  group: spaceage-post
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check Instagram access (posts nothing)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python spaceage/post_instagram.py --check

  post:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # upload order comes from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow requests

      - name: Dry run without Instagram access
        if: env.IG_USER_ID == '' || env.IG_ACCESS_TOKEN == ''
        run: |
          echo "::warning::IG_USER_ID / IG_ACCESS_TOKEN not set - nothing is posted (see spaceage/README.md)"
          python spaceage/post_queue.py --dry-run

      - name: Take next file from the queue
        id: next
        if: env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != ''
        run: python spaceage/post_queue.py | tee -a "$GITHUB_OUTPUT"

      - name: Commit the move to posted/
        id: commit
        if: steps.next.outputs.kind == 'image' || steps.next.outputs.kind == 'video'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A spaceage/queue spaceage/posted
          git commit -m "Post ${{ steps.next.outputs.source }} [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish on Instagram
        if: steps.commit.outcome == 'success'
        env:
          KIND: ${{ steps.next.outputs.kind }}
          MEDIA: ${{ steps.next.outputs.media }}
          CAPTION: ${{ steps.next.outputs.caption }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$KIND" = image ]; then
            url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SHA/$MEDIA"
            python spaceage/post_instagram.py --image-url "$url" --caption-file "$CAPTION"
          else
            python spaceage/post_instagram.py --video "$MEDIA" --caption-file "$CAPTION"
          fi

      - name: Put the file back into the queue if posting failed
        if: failure() && steps.commit.outcome == 'success'
        run: |
          git revert --no-edit HEAD
          git push
