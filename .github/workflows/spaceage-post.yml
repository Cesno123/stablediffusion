name: SpaceAge post

on:
  schedule:
    # 4 posts a day: 08:07, 12:07, 16:07, 20:07 UTC = 09:07, 13:07, 17:07, 21:07 Berlin in winter
    - cron: "7 8,12,16,20 * * *"
  workflow_dispatch:
  # A push to the posting code only runs the read-only access check below.
  push:
    paths:
      - "spaceage/post_instagram.py"
      - "spaceage/post_queue.py"
      - ".github/workflows/spaceage-post.yml"

permissions:
  contents: write  # move posted files out of the queue

concurrency:
  group: spaceage-post
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests pillow numpy
      - name: Check Instagram access (posts nothing)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python spaceage/post_instagram.py --check
      - name: Test reel upload (processed by Instagram, not published)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "spaceage")
          from PIL import Image
          import post_queue
          Image.new("RGB", (1152, 2048), (20, 30, 70)).save("/tmp/test.png")
          post_queue.to_reel("/tmp/test.png", "/tmp/test.mp4", seed=1)
          PY
          echo "test - not published" > /tmp/caption.txt
          url=$(spaceage/host_reel.sh /tmp/test.mp4)
          echo "hosted at $url"
          python spaceage/post_instagram.py --video-url "$url" --caption-file /tmp/caption.txt --no-publish

  post:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # upload order comes from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow requests numpy

      - name: Dry run without Instagram access
        if: env.IG_USER_ID == '' || env.IG_ACCESS_TOKEN == ''
        run: |
          echo "::warning::IG_USER_ID / IG_ACCESS_TOKEN not set - nothing is posted (see spaceage/README.md)"
          python spaceage/post_queue.py --dry-run

      # Manually uploaded files go first; only an empty queue gets a new FLUX image.
      - name: Generate an image if the queue is empty
        if: env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != '' && env.BFL_API_KEY != ''
        run: python spaceage/autogen.py

      - name: Take next file from the queue
        id: next
        if: env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != ''
        run: python spaceage/post_queue.py | tee -a "$GITHUB_OUTPUT"

      - name: Commit the move to posted/
        id: commit
        if: steps.next.outputs.kind == 'image' || steps.next.outputs.kind == 'video'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A spaceage/queue spaceage/posted
          git commit -m "Post ${{ steps.next.outputs.source }} [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish on Instagram
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.next.outputs.kind }}
          MEDIA: ${{ steps.next.outputs.media }}
          CAPTION: ${{ steps.next.outputs.caption }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$KIND" = image ]; then
            url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SHA/$MEDIA"
            python spaceage/post_instagram.py --image-url "$url" --caption-file "$CAPTION"
          else
            # Instagram Login only accepts videos by public URL
            url=$(spaceage/host_reel.sh "$MEDIA")
            python spaceage/post_instagram.py --video-url "$url" --caption-file "$CAPTION"
          fi

      - name: Put the file back into the queue if posting failed
        if: failure() && steps.commit.outcome == 'success'
        run: |
          git revert --no-edit HEAD
          git push
