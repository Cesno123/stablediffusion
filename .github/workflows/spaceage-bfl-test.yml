name: SpaceAge FLUX test

# Renders a few random images with FLUX Pro and FLUX Ultra for a quality
# comparison and publishes them on a preview release. Posts nothing.
# Manual only: every run spends BFL credits.
on:
  workflow_dispatch:

permissions:
  contents: write  # create the preview release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      # The same three library prompts, three ways. Each step may fail on its
      # own (e.g. an endpoint name) without losing the other results.
      - name: FLUX 1.1 Ultra raw (baseline)
        continue-on-error: true
        run: >-
          python spaceage/bfl.py --out out --count 3 --model ultra --raw --library --prefix a_ultra
          --include "Fortress freighter" --include "Moon rocket" --include "Black hole station"
      - name: FLUX.2 max
        continue-on-error: true
        run: >-
          python spaceage/bfl.py --out out --count 3 --model flux2max --library --prefix b_flux2max
          --include "Fortress freighter" --include "Moon rocket" --include "Black hole station"
      - name: FLUX.2 pro with the owner's Midjourney images as style references
        continue-on-error: true
        run: >-
          python spaceage/bfl.py --out out --count 3 --model flux2pro --style-refs --library --prefix c_flux2pro_ref
          --include "Fortress freighter" --include "Moon rocket" --include "Black hole station"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          shopt -s nullglob
          {
            echo "Vergleich (nichts gepostet): a_* = FLUX 1.1 Ultra raw, b_* = FLUX.2 max, c_* = FLUX.2 pro mit deinen Midjourney-Bildern als Stilvorlage. Gleiche drei Prompts."
            for t in out/*.txt; do echo; echo "**$(basename "$t" .txt)**: $(cat "$t")"; done
          } > notes.md
          cat notes.md
          gh release create "flux-test-$RUN_NUMBER" out/*.jpg --target "$GITHUB_SHA" --prerelease \
            --title "FLUX-Test #$RUN_NUMBER" --notes-file notes.md
