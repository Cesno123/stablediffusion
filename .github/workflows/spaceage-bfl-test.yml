name: SpaceAge FLUX test

# Renders a few library prompts with FLUX and publishes them on a preview
# release for review. Posts nothing.
# Manual only: every run spends BFL credits.
on:
  workflow_dispatch:

permissions:
  contents: write  # create the preview release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      # One prompt per theme of the library, rendered with FLUX.2 max.
      - name: FLUX.2 max, one image per theme
        run: >-
          python spaceage/bfl.py --out out --count 4 --model flux2max --library --prefix theme
          --include "Clarke: Inside the cylinder" --include "Wells: Tripods at dusk"
          --include "Asimov: City planet" --include "Pulp: Sphere over the capital"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          shopt -s nullglob
          {
            echo "Test (nichts gepostet): je ein Bild pro Thema (Clarke, Wells, Asimov, Heftroman) mit FLUX.2 max."
            for t in out/*.txt; do echo; echo "**$(basename "$t" .txt)**: $(cat "$t")"; done
          } > notes.md
          cat notes.md
          gh release create "flux-test-$RUN_NUMBER" out/*.jpg --target "$GITHUB_SHA" --prerelease \
            --title "FLUX-Test #$RUN_NUMBER" --notes-file notes.md
