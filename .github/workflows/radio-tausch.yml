name: Radio-Tausch App bauen

on:
  push:
    paths:
      - "radio-tausch/**"
      - ".github/workflows/radio-tausch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio-tausch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: KI-Modell (YAMNet) herunterladen
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite

      - name: App bauen
        run: gradle assembleDebug --no-daemon

      # Nur als Build-Ergebnis speichern, NICHT öffentlich als Release verteilen.
      # Abgeholt wird es über die GitHub-Schnittstelle und dem Nutzer direkt geschickt.
      - name: App als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: RadioSwap
          path: radio-tausch/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
