<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Röhrenkiste</title>
<style>
  :root {
    --bg: #15120f; --panel: #221d18; --line: #3a322a; --text: #ece3d3; --muted: #a39684;
    --accent: #e3a548; --on: #7fe08a; --led: #ff3b2f; --tv: #2b2e33; --key: #d9d6cf; --keytext: #222;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 0 14px; }
  header h1 { margin: 0; font: 700 30px/1 "Courier New", monospace; letter-spacing: 6px; color: var(--accent); }
  #clock { font: 22px "Courier New", monospace; color: var(--muted); }

  .tv { background: var(--tv); border-radius: 22px; padding: 18px; box-shadow: 0 8px 30px #0008; }
  .bezel { background: #b9bcc0; border-radius: 18px; padding: 8px; }
  #screen { position: relative; background: #000; border-radius: 26px / 20px; aspect-ratio: 4/3;
            overflow: hidden; }
  #screen video, #screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
            object-fit: contain; background: #000; }
  #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
            background: repeating-linear-gradient(0deg, #0000 0 2px, #0000001f 2px 3px);
            box-shadow: inset 0 0 60px #000a; }
  #osd { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 2;
         padding: 20px; font: 20px/1.4 "Courier New", monospace; color: var(--on); background: #000; }
  #osd.bars { color: #fff; background: linear-gradient(90deg,#c0c0c0 0 14.3%,#c0c000 0 28.6%,#00c0c0 0 42.9%,
            #00c000 0 57.1%,#c000c0 0 71.4%,#c00000 0 85.7%,#0000c0 0 100%); }
  #osd.bars span { background: #000c; padding: 10px 14px; }
  #osd[hidden] { display: none; }
  #badge { position: absolute; top: 10px; right: 12px; z-index: 3; font: 12px system-ui, sans-serif;
           background: #000b; color: #fff; padding: 4px 9px; border-radius: 999px; text-decoration: none; }
  .plate { display: flex; justify-content: space-between; align-items: center; margin: 14px 4px; }
  .plate small { display: block; letter-spacing: 3px; font-size: 12px; color: #ccc; }
  .plate small + small { color: #888; letter-spacing: 2px; }
  #led { background: #1a0705; color: var(--led); font: 30px "Courier New", monospace; padding: 4px 14px;
         border-radius: 6px; min-width: 96px; text-align: right; text-shadow: 0 0 8px #ff3b2f88; }
  #led.live::before { content: "● "; font-size: 16px; vertical-align: middle; }
  .grille { height: 26px; border-radius: 6px; margin: 0 4px 14px;
            background: repeating-linear-gradient(90deg, #111 0 4px, #3a3d42 4px 7px); }
  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: #111; padding: 8px;
          border-radius: 10px; }
  .keys button { background: linear-gradient(#f2f0ec, var(--key)); color: var(--keytext); border: 0;
          border-radius: 6px; padding: 14px 4px; font: 700 18px system-ui, sans-serif; cursor: pointer;
          box-shadow: 0 3px 0 #777; }
  .keys button:active { transform: translateY(2px); box-shadow: 0 1px 0 #777; }
  .keys .wide { grid-column: span 2; }
  .keys .power { color: #b0281c; }
  .keys .power.on { color: #1d7a2c; }
  .keys .live { background: linear-gradient(#f3d77a, #d9b04a); }
  .keys .castbtn { grid-column: 1 / -1; background: linear-gradient(#5d7fd6, #3c5bb0); color: #fff; }
  .keys .castbtn.on { background: linear-gradient(#5fd07a, #2f9a4c); }
  .castmsg { margin: 10px 4px 0; color: #ddd; font-size: 14px; }
  .keys .star.on { background: linear-gradient(#e2574a, #b33024); color: #fff; }
  .keys button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #now h2 { margin: 18px 0 2px; font-size: 22px; }
  #now p { margin: 2px 0; color: var(--muted); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); margin-top: 6px; }

  .box { border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-top: 18px; }
  .box h3 { margin: 14px 0 8px; font-size: 13px; letter-spacing: 3px; color: var(--muted); font-weight: 500; }
  .box h3:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
          padding: 9px 16px; font: inherit; cursor: pointer; }
  .chip.on { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: 700; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .checks label { display: flex; gap: 8px; align-items: center; }
  .checks input { width: 20px; height: 20px; accent-color: #6b8cff; }
  input[type=text] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 9px; font: inherit; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.t { white-space: nowrap; color: var(--accent); width: 62px; font-variant-numeric: tabular-nums; }
  td.s { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  tr.cur td { background: #2c251d; }
  details summary { cursor: pointer; font-weight: 700; font-size: 18px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .keyrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .keyrow input { margin-top: 0; min-width: 0; flex: 1; }
  .keyrow .plain { margin-top: 0; white-space: nowrap; }
  .keymsg { margin: 8px 0 0; font-weight: 600; }
  .keymsg.good { color: var(--on); }
  .keymsg.bad { color: #ff7a6b; }
  .plain { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 9px 14px; font: inherit; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>RÖHRENKISTE</h1><span id="clock">--:--</span></header>

  <div class="tv">
    <div class="bezel">
      <div id="screen">
        <div id="player"></div>
        <a id="badge" target="_blank" rel="noopener" hidden></a>
        <div id="osd">Jahrzehnt und Kanal wählen, dann AN tippen</div>
      </div>
    </div>
    <div class="plate">
      <div><small>STEREO COLOR</small><small>66 cm · PAL</small></div>
      <div id="led">01</div>
    </div>
    <div class="grille"></div>
    <div class="keys">
      <button id="prev" title="Vorherige Sendung">⏮</button>
      <button id="next" title="Nächste Sendung">⏭</button>
      <button id="chdown" title="Kanal runter">CH−</button>
      <button id="power" class="power" title="Einschalten">AN</button>
      <button id="chup" title="Kanal hoch">CH+</button>
      <button id="full" title="Vollbild">⛶</button>
      <button id="live" class="live wide" title="Zurück zum laufenden Programm">LIVE</button>
      <button id="reloadKey" class="wide" title="Sendungen neu suchen">NEU SUCHEN</button>
      <button id="star" class="star wide" title="Sendung merken">☆ MERKEN</button>
      <button id="cast" class="castbtn" title="Auf den Fernseher übertragen">📡 AUF DEN FERNSEHER</button>
    </div>
    <p id="castmsg" class="castmsg" hidden></p>
  </div>

  <section id="now">
    <h2 id="title">Kein Programm</h2>
    <p id="meta">Bereit</p>
    <progress id="prog" value="0" max="1"></progress>
  </section>

  <div class="box">
    <h3>JAHRZEHNT</h3>
    <div class="chips" id="decades"></div>
    <h3>KANAL</h3>
    <div class="chips" id="chans"></div>
    <h3>SPRACHE</h3>
    <div class="chips" id="langs"></div>
    <h3>QUELLEN</h3>
    <div class="checks" id="sources"></div>
    <label class="checks" style="margin-top:10px;align-items:center">Dailymotion-Player:
      <select id="dmplayer" class="plain" style="margin-top:0">
        <option value="geo">Variante A (neu)</option><option value="classic">Variante B (klassisch)</option>
      </select></label>
    <label class="checks" style="margin-top:10px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="strict" style="flex:none"> Nur Sendungen mit passender Jahreszahl (sonst auch ohne Jahresangabe)</label>
    <div class="keyrow">
      <input type="text" id="ytkey" placeholder="YouTube-API-Schlüssel hier einfügen" autocomplete="off" spellcheck="false">
      <button id="ytsave" class="plain">Speichern &amp; prüfen</button>
    </div>
    <p id="ytmsg" class="keymsg"></p>
    <p class="hint">Der Schlüssel bleibt nur in diesem Browser gespeichert. Ohne Schlüssel wird YouTube übersprungen.</p>
  </div>

  <div class="box">
    <details open>
      <summary>Programm dieses Kanals</summary>
      <table id="guide"></table>
    </details>
  </div>

  <p id="status"></p>
</div>

<script>
/* Google Cast: wird aufgerufen, sobald Chrome das Übertragen-Modul geladen hat. */
window.__onGCastApiAvailable = ok => { if (!ok) return; if (typeof initCast === "function") initCast(); else window.__castPending = true; };
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>
<script>
/* ======================= EINSTELLUNGEN =======================
   Kanäle = Suchbegriffe ("|" trennt). Die Suche läuft pro Jahrzehnt.
   Viele Kanäle passen nur zu bestimmten Jahrzehnten (Privatfernsehen ab 1984,
   VIVA ab 1993, DDR bis 1990) – leere Kanäle zeigen „Sendepause“.            */
const DECADES = [
  { id: "70", label: "70er", from: 1970, to: 1979 },
  { id: "80", label: "80er", from: 1980, to: 1989 },
  { id: "90", label: "90er", from: 1990, to: 1999 },
  { id: "00", label: "00er", from: 2000, to: 2009 },
  { id: "10", label: "10er", from: 2010, to: 2015 },
];
const CHANNELS = [
  { name: "Hitparade & Musik", q: "ZDF Hitparade|Formel Eins|Musikladen|Disco Ilja Richter|Peters Pop Show|Bravo TV|Top of the Pops" },
  { name: "Krimi",             q: "Tatort|Derrick|Der Alte|Polizeiruf 110|Ein Fall für zwei|SOKO 5113|Schimanski|Der Fahnder" },
  { name: "Familienserien",    q: "Lindenstraße|Schwarzwaldklinik|Traumschiff|Diese Drombuschs|Ein Herz und eine Seele|Forsthaus Falkenau|Marienhof|Gute Zeiten schlechte Zeiten" },
  { name: "Samstagabend-Show", q: "Wetten dass|Dalli Dalli|Am laufenden Band|Der große Preis|Verstehen Sie Spaß|Geld oder Liebe|Herzblatt|Schlag den Raab" },
  { name: "Comedy",            q: "Loriot|Otto Show|Klimbim|Harald Schmidt Show|RTL Samstag Nacht|Switch|Sketchup|Ladykracher" },
  { name: "Kinder-TV",         q: "Sesamstraße|Sendung mit der Maus|Löwenzahn|Pumuckl|Augsburger Puppenkiste|Siebenstein|Hallo Spencer|Tigerenten Club" },
  { name: "Nachrichten",       q: "Tagesschau|Tagesthemen|heute journal|Aktuelle Kamera|RTL aktuell|Tagesschau vom" },
  { name: "Werbung & Ansagen", q: "Werbung|Werbeblock|Fernsehwerbung|Programmansage|Sendeschluss|Mainzelmännchen" },
  { name: "Sport",             q: "Sportschau|aktuelle Sportstudio|ran Sat.1|Bundesliga Zusammenfassung|Formel 1 RTL|Boris Becker Wimbledon" },
  { name: "DDR-Fernsehen",     q: "DDR Fernsehen|Ein Kessel Buntes|Aktuelle Kamera|Sandmännchen DDR|Rund DDR|Das Spielhaus" },
  { name: "Zeitgeschichte",    q: "Dokumentation Deutschland|Mauerfall|Wiedervereinigung|Deutscher Herbst|Reportage Zeitgeschichte" },
  { name: "Privatfernsehen",   q: "RTL plus|Tutti Frutti|Glücksrad|Der Preis ist heiß|Explosiv|Arabella|Hans Meiser|Bärbel Schäfer" },
  { name: "Musiksender",       q: "VIVA|VIVA Zwei|MTV Germany|Interaktiv VIVA|Wah Wah|MTV Hot" },
  { name: "VHS-Mitschnitte",   q: "VHS Mitschnitt|TV Mitschnitt|Fernsehmitschnitt|Werbepause VHS" },
  { name: "Gemerkt",           fav: true },
];
const LANGS = [ { id: "de", label: "Deutsch" }, { id: "all", label: "Alle Sprachen" } ];
const SOURCES = [
  { id: "yt", label: "YouTube (Schlüssel nötig)" },
  { id: "mt", label: "ARD/ZDF-Mediatheken" },
  { id: "ia", label: "Internet Archive" },
  { id: "dm", label: "Dailymotion" },
  { id: "pt", label: "PeerTube" },
  { id: "eu", label: "Europeana / EUscreen" },
  { id: "wc", label: "Wikimedia Commons" },
];
/* Suchwort fürs Jahrzehnt bei YouTube, z. B. "Tatort 80er" */
const YT_HINT = { "70": "70er", "80": "80er", "90": "90er", "00": "2000er", "10": "2010er" };
const YT_TERMS = 4;   // Suchen pro Kanal: je 100 von 10.000 Einheiten Tageskontingent
const DEFAULT_MIN = 30;            // geschätzte Länge, wenn eine Quelle keine Dauer liefert
const EPOCH = Date.UTC(2020, 0, 1) / 1000;
const CACHE_HOURS = 24;
/* ============================================================ */

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("rk2-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("rk2-" + k, JSON.stringify(v)); } catch (e) {} },
};
const state = {
  decade: store.get("decade", "80"), chan: store.get("chan", 0), lang: store.get("lang", "de"),
  sources: { yt: true, mt: true, ia: true, dm: true, pt: true, eu: true, wc: true, ...store.get("sources3", {}) },
  strict: store.get("strict", true), dmPlayer: store.get("dmPlayer", "geo"), ytkey: store.get("ytkey", ""),
  on: false, live: true, pIndex: 0, items: [], playingKey: null, loadToken: 0,
};
const favs = () => store.get("favs", []);

/* ---------- Hilfsfunktionen ---------- */
const now = () => Date.now() / 1000;
const hhmm = t => new Date(t * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dec = () => DECADES.find(d => d.id === state.decade) || DECADES[1];
const srcName = { mt: "Mediathek", ia: "Internet Archive", dm: "Dailymotion", yt: "YouTube",
                  pt: "PeerTube", eu: "Europeana", wc: "Wikimedia Commons" };

function yearsIn(text) { return (String(text).match(/\b(19[5-9]\d|20[0-2]\d)\b/g) || []).map(Number); }
/* Jahr eines Treffers: echtes Jahr (Archive) oder Jahreszahl im Titel/Text.
   Ergebnis: Jahr innerhalb des Jahrzehnts, null (unbekannt) oder false (passt nicht). */
function fitYear(item, d) {
  if (item.year) return item.year >= d.from && item.year <= d.to ? item.year : false;
  const ys = yearsIn(item.title + " " + (item.desc || "").slice(0, 300));
  if (!ys.length) return null;
  const hit = ys.find(y => y >= d.from && y <= d.to);
  return hit || false;
}
function parseIso(d) {   // PT1H2M3S → Sekunden
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || ""); if (!m) return 0;
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
function parseRuntime(r) {  // "00:23:45", "23:45", "23 min", "1380"
  if (!r) return 0; r = String(Array.isArray(r) ? r[0] : r);
  if (/^\d+(:\d+){1,2}$/.test(r.trim())) return r.trim().split(":").reduce((a, b) => a * 60 + +b, 0);
  const m = /(\d+)\s*(min|minutes|minuten)/i.exec(r); if (m) return +m[1] * 60;
  return /^\d+(\.\d+)?$/.test(r.trim()) ? Math.round(+r) : 0;
}
/* Blockiert der Browser eine Quelle (CORS), läuft die Abfrage über den kleinen
   Netlify-Proxy (netlify/functions/proxy.mjs). Ohne Netlify gibt es den nicht. */
const PROXY = "/.netlify/functions/proxy?url=";
let proxyState = "unknown";   // unknown | ok | none
async function fetchSmart(url, opt) {
  try { return await fetch(url, opt); }
  catch (e) {
    if (proxyState === "none" || location.protocol === "file:") throw e;
    const r = await fetch(PROXY + encodeURIComponent(url), opt);
    if (r.status === 404 && proxyState === "unknown") { proxyState = "none"; throw e; }
    proxyState = "ok"; return r;
  }
}
async function getJson(url, opt) {
  const r = await fetchSmart(url, opt);
  if (!r.ok) {
    let why = ""; try { why = (await r.json()).error?.errors?.[0]?.reason || ""; } catch (e) {}
    const err = new Error(r.status + " " + url.split("?")[0]); err.status = r.status; err.reason = why; throw err;
  }
  return r.json();
}

/* ---------- Quellen ---------- */
async function searchMediathek(term) {
  const j = await getJson("https://mediathekviewweb.de/api/query", { method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ queries: [{ fields: ["topic", "title"], query: term }], sortBy: "timestamp",
      sortOrder: "asc", future: false, duration_min: 120, offset: 0, size: 100 }) });
  return (j.result?.results || []).map(x => ({
    src: "mt", id: x.id || x.url_video, title: (x.topic && x.topic !== x.title ? x.topic + ": " : "") + x.title,
    desc: (x.channel || "") + " · " + (x.description || ""), duration: x.duration,
    url: (x.url_video_hd || x.url_video || "").replace(/^http:/, "https:"),
  })).filter(x => x.url && !/\.m3u8/.test(x.url));
}
async function searchArchive(terms, d) {
  const q = "(" + terms.map(t => `"${t.replace(/"/g, "")}"`).join(" OR ") + ")" +
    ` AND mediatype:movies AND year:[${d.from} TO ${d.to}]` +
    (state.lang === "de" ? " AND (language:ger OR language:German OR language:deu OR language:Deutsch)" : "");
  const url = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q) +
    "&fl[]=identifier&fl[]=title&fl[]=year&fl[]=runtime&fl[]=description&rows=150&output=json";
  const j = await getJson(url);
  return (j.response?.docs || []).map(x => ({
    src: "ia", id: x.identifier, title: Array.isArray(x.title) ? x.title[0] : x.title,
    desc: String(Array.isArray(x.description) ? x.description[0] : x.description || "").replace(/<[^>]+>/g, ""),
    year: +x.year || 0, duration: parseRuntime(x.runtime),
  }));
}
async function searchDailymotion(term) {
  const url = "https://api.dailymotion.com/videos?fields=id,title,duration,description,allow_embed,private,status,geoblocking" +
    "&limit=50&search=" + encodeURIComponent(term) + (state.lang === "de" ? "&languages=de" : "");
  const j = await getJson(url);
  // Nur Videos, die laut Dailymotion eingebettet werden dürfen und in Deutschland laufen.
  const blockedDe = g => { if (!Array.isArray(g) || !g.length) return false;
    const mode = String(g[0]).toLowerCase(), list = g.slice(1).map(c => String(c).toLowerCase());
    return mode === "deny" ? list.includes("de") : mode === "allow" && list.length ? !list.includes("de") : false; };
  return (j.list || [])
    .filter(x => x.allow_embed !== false && x.private !== true && (!x.status || x.status === "published") && !blockedDe(x.geoblocking))
    .map(x => ({ src: "dm", id: x.id, title: x.title, desc: x.description || "", duration: x.duration }));
}
async function searchYouTube(term, d) {
  term = term + " " + YT_HINT[d.id];
  const k = encodeURIComponent(state.ytkey);
  const s = await getJson("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true" +
    "&maxResults=50&q=" + encodeURIComponent(term) + (state.lang === "de" ? "&relevanceLanguage=de" : "") + "&key=" + k);
  const ids = (s.items || []).map(i => i.id.videoId).filter(Boolean);
  if (!ids.length) return [];
  const v = await getJson("https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=" + ids.join(",") + "&key=" + k);
  return (v.items || []).map(x => ({ src: "yt", id: x.id, title: x.snippet.title,
    desc: x.snippet.description || "", duration: parseIso(x.contentDetails.duration) }));
}

async function searchPeerTube(term) {   // Suche über alle PeerTube-Server (Sepia Search)
  const j = await getJson("https://sepiasearch.org/api/v1/search/videos?count=50&sort=-match&search=" +
    encodeURIComponent(term) + (state.lang === "de" ? "&languageOneOf=de" : ""));
  return (j.data || []).map(x => ({ src: "pt", id: x.uuid, title: x.name, desc: x.description || "",
    duration: x.duration, embed: x.embedUrl, url: x.url,
    year: x.originallyPublishedAt ? new Date(x.originallyPublishedAt).getFullYear() : 0 }));
}
async function searchEuropeana(terms, d) {   // europäische TV-Archive, u. a. EUscreen
  const q = terms.map(t => `"${t.replace(/"/g, "")}"`).join(" OR ");
  const j = await getJson("https://api.europeana.eu/record/v2/search.json?wskey=api2demo&rows=100&media=true&profile=rich" +
    "&qf=TYPE:VIDEO&qf=" + encodeURIComponent(`YEAR:[${d.from} TO ${d.to}]`) + "&query=" + encodeURIComponent(q) +
    (state.lang === "de" ? "&qf=LANGUAGE:de" : ""));
  return (j.items || []).map(x => ({ src: "eu", id: x.id, title: (x.title || [""])[0], desc: (x.dcDescription || [""])[0],
    year: +((x.year || [])[0]) || 0, duration: 0, url: (x.edmIsShownBy || [""])[0], page: x.guid }))
    .filter(x => /\.(mp4|m4v|webm|ogv)(\?|$)/i.test(x.url));
}
async function searchCommons(term) {
  const j = await getJson("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch=" + encodeURIComponent(term + " filetype:video") +
    "&prop=imageinfo&iiprop=url|size|extmetadata");
  return Object.values(j.query?.pages || {}).map(p => {
    const ii = (p.imageinfo || [])[0] || {}, em = ii.extmetadata || {};
    const y = yearsIn((em.DateTimeOriginal?.value || "").replace(/<[^>]+>/g, ""))[0] || 0;
    return { src: "wc", id: p.title, title: p.title.replace(/^File:|\.[a-z0-9]+$/gi, ""),
      desc: (em.ImageDescription?.value || "").replace(/<[^>]+>/g, ""), year: y,
      duration: Math.round(ii.duration || 0), url: ii.url, page: ii.descriptionurl };
  }).filter(x => x.url);
}

async function collect(ch, d) {
  if (ch.fav) return { items: favs(), note: "deine gemerkten Sendungen" };
  const terms = ch.q.split("|").map(s => s.trim()).filter(Boolean);
  const jobs = [], failed = new Set();
  const run = (src, p) => jobs.push(p.catch(e => {
    console.warn(src, e);
    if (src === "yt" && /quota/i.test(e.reason)) failed.add("YouTube (Tageskontingent aufgebraucht, morgen wieder)");
    else if (src === "yt" && (e.status === 400 || e.status === 403)) failed.add("YouTube (Schlüssel ungültig oder für diese Seite gesperrt)");
    else failed.add(srcName[src]);
    return [];
  }));
  if (state.sources.ia) run("ia", searchArchive(terms, d));
  if (state.sources.eu) run("eu", searchEuropeana(terms, d));
  for (const t of terms) {
    if (state.sources.mt) run("mt", searchMediathek(t));
    if (state.sources.dm) run("dm", searchDailymotion(t));
    if (state.sources.pt) run("pt", searchPeerTube(t));
    if (state.sources.wc) run("wc", searchCommons(t));
  }
  if (state.sources.yt && state.ytkey) for (const t of terms.slice(0, YT_TERMS)) run("yt", searchYouTube(t, d));
  const all = (await Promise.all(jobs)).flat();

  const seen = new Set(), matched = [], unknown = [];
  for (const it of all) {
    const key = it.src + ":" + it.id; if (seen.has(key)) continue; seen.add(key);
    if (it.duration && it.duration < 60) continue;           // Schnipsel aussortieren
    const y = fitYear(it, d);
    if (y === false) continue;
    if (y) matched.push({ ...it, year: y }); else unknown.push(it);
  }
  let items = matched, note = `${matched.length} mit passender Jahreszahl`;
  if (!state.strict || matched.length < 5) {
    items = matched.concat(unknown);
    note += `, ${unknown.length} ohne Jahresangabe` + (state.strict ? " (ergänzt, weil zu wenig Treffer)" : "");
  }
  for (const it of items) { it.est = !it.duration; it.duration = it.duration || DEFAULT_MIN * 60; }
  if (failed.size) note += ` · nicht erreichbar: ${[...failed].join(", ")}`;
  if (state.sources.yt && !state.ytkey) note += " · YouTube übersprungen (kein Schlüssel)";
  return { items, note };
}

async function loadChannel(force) {
  const ch = CHANNELS[state.chan], d = dec();
  const cacheKey = "c2-" + [d.id, state.chan, state.lang, state.strict, Object.keys(state.sources).filter(k => state.sources[k]).join(""), !!state.ytkey].join("-");
  const token = ++state.loadToken;
  state.loading = true;
  let data = !force && !ch.fav && store.get(cacheKey, null);
  if (data && Date.now() - data.at > CACHE_HOURS * 3600e3) data = null;
  if (!data) {
    $("status").textContent = `Suche „${ch.name}“ in den ${d.label}n …`;
    const r = await collect(ch, d);
    data = { at: Date.now(), ...r };
    if (!ch.fav && r.items.length) store.set(cacheKey, data);
  }
  if (token !== state.loadToken) return;          // inzwischen umgeschaltet
  state.loading = false;
  state.all = shuffled(data.items, +d.id * 100 + state.chan + 1);
  applyView();
  state.pIndex = 0; state.playingKey = null;
  $("status").textContent = `${ch.name} · ${d.label}: ${data.items.length} Sendungen (${data.note})`;
  refresh();
}

/* ---------- Sendeplan ----------
   Endlosschleife in fester Reihenfolge; die Uhr bestimmt Sendung + Sekunde.
   Bei geschätzter Dauer kann eine Sendung früher enden – dann läuft bis zum
   nächsten Sendeplatz ein Pausenbild, wie früher im Fernsehen.               */
function shuffled(items, seed) {
  const a = items.slice(); let s = seed;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function liveAt(t) {
  const L = state.items; if (!L.length) return null;
  const total = L.reduce((s, x) => s + x.duration, 0);
  let pos = ((t - EPOCH) % total + total) % total, i = 0;
  while (pos >= L[i].duration) { pos -= L[i].duration; i++; }
  return { i, offset: pos, start: t - pos };
}

/* ---------- Bildschirm ---------- */
function osd(text, bars) {
  $("osd").hidden = false; $("osd").className = bars ? "bars" : "";
  $("osd").innerHTML = bars ? `<span>${esc(text).replace(/\n/g, "<br>")}</span>` : esc(text).replace(/\n/g, "<br>");
}
function clearPlayer() { $("player").innerHTML = ""; $("badge").hidden = true; }

function origin(it) {
  return it.src === "yt" ? "https://www.youtube.com/watch?v=" + it.id
       : it.src === "dm" ? "https://www.dailymotion.com/video/" + it.id
       : it.src === "ia" ? "https://archive.org/details/" + it.id
       : it.page || it.url;
}
async function play(it, offset, key) {
  state.playingKey = key;
  if (state.casting) return castPlay(it, offset, key);
  clearPlayer(); osd("Einstellen …");
  const b = $("badge"); b.hidden = false; b.href = origin(it); b.textContent = srcName[it.src] + " ↗";
  const start = Math.max(0, Math.floor(offset));
  try {
    if (it.src === "yt" || it.src === "dm" || it.src === "pt") {
      const f = document.createElement("iframe");
      f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture"; f.allowFullscreen = true;
      /* Fremde Player verlangen zu wissen, auf welcher Seite sie laufen. Fehlt diese
         Angabe (Referrer), antworten YouTube und Dailymotion mit Fehler/„Forbidden“. */
      f.referrerPolicy = "strict-origin-when-cross-origin";
      f.src = it.src === "yt"
        ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(it.id)}?autoplay=1&start=${start}&rel=0&origin=${encodeURIComponent(location.origin)}`
        : it.src === "dm"
        ? (state.dmPlayer === "classic"
            ? `https://www.dailymotion.com/embed/video/${encodeURIComponent(it.id)}?autoplay=1&start=${start}`
            : `https://geo.dailymotion.com/player.html?video=${encodeURIComponent(it.id)}&autoplay=1&startTime=${start}`)
        : it.embed + (it.embed.includes("?") ? "&" : "?") + `autoplay=1&start=${start}s&title=0&warningTitle=0`;
      $("player").appendChild(f); $("osd").hidden = true; return;
    }
    const url = await mediaUrl(it);
    if (state.playingKey !== key) return;
    const v = document.createElement("video");
    v.autoplay = true; v.playsInline = true; v.controls = true;
    v.src = url + "#t=" + start;
    v.onplaying = () => { $("osd").hidden = true; };
    v.onerror = () => { clearPlayer(); osd("Bildstörung\nDiese Sendung ist nicht mehr abrufbar. ⏭ für die nächste.", true); };
    v.onended = () => {
      clearPlayer();
      if (!state.live) { step(1); return; }
      const s = liveAt(now()); const nx = s && state.items[(s.i + 1) % state.items.length];
      osd(`Gleich im Anschluss\n${nx ? nx.title : ""}\num ${s ? hhmm(s.start + state.items[s.i].duration) : ""}`, true);
    };
    $("player").appendChild(v);
    v.play().catch(() => osd("Tippe auf das Bild, um den Ton zu starten"));
  } catch (e) {
    console.warn(e); clearPlayer(); osd("Bildstörung\nSendung konnte nicht geladen werden. ⏭ für die nächste.", true);
  }
}

/* ---------- Übertragen auf den Fernseher (Chromecast / Google TV) ----------
   Übertragbar sind nur Quellen mit direkter Videodatei. YouTube und Dailymotion
   geben keine Datei heraus – solange übertragen wird, fallen sie aus dem Plan.   */
const CASTABLE = new Set(["mt", "ia", "eu", "wc", "pt"]);
const castable = it => CASTABLE.has(it.src) && !/\.ogv(\?|$)/i.test(it.url || "");
function applyView() {
  state.all = state.all || [];
  state.items = state.casting ? state.all.filter(castable) : state.all;
  state.pIndex = 0; state.playingKey = null;
}
async function mediaUrl(it) {
  if (it.src === "ia") {
    const m = await getJson("https://archive.org/metadata/" + encodeURIComponent(it.id));
    const files = (m.files || []).filter(f => /\.(mp4|m4v|webm|ogv)$/i.test(f.name));
    const f = files.find(f => /h\.264|mpeg4/i.test(f.format || "")) || files[0];
    if (!f) throw new Error("keine abspielbare Datei");
    return "https://archive.org/download/" + encodeURIComponent(it.id) + "/" + f.name.split("/").map(encodeURIComponent).join("/");
  }
  if (it.src === "pt") {   // PeerTube: Videodatei über die Schnittstelle des jeweiligen Servers
    const host = new URL(it.embed).origin;
    const v = await getJson(host + "/api/v1/videos/" + encodeURIComponent(it.id));
    const f = (v.files || [])[0] || ((v.streamingPlaylists || [])[0]?.files || [])[0];
    if (f?.fileUrl) return f.fileUrl;
    if (v.streamingPlaylists?.[0]?.playlistUrl) return v.streamingPlaylists[0].playlistUrl;
    throw new Error("keine Datei");
  }
  return it.url;
}
const mimeOf = u => /\.m3u8/i.test(u) ? "application/x-mpegurl" : /\.webm/i.test(u) ? "video/webm" : "video/mp4";
let castReady = false;
function initCast() {
  try {
    const ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({ receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                     autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
    ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, e => {
      const S = cast.framework.SessionState;
      if (e.sessionState === S.SESSION_STARTED || e.sessionState === S.SESSION_RESUMED) setCasting(true);
      if (e.sessionState === S.SESSION_ENDED) setCasting(false);
    });
    castReady = true;
  } catch (e) { console.warn("Cast nicht verfügbar", e); }
}
function castMsg(t) { $("castmsg").hidden = !t; $("castmsg").textContent = t || ""; }
function setCasting(on) {
  if (state.casting === on) return;
  state.casting = on; clearPlayer(); applyView();
  $("cast").classList.toggle("on", on);
  $("cast").textContent = on ? "📡 ÜBERTRAGUNG BEENDEN" : "📡 AUF DEN FERNSEHER";
  const skipped = state.all.length - state.items.length;
  castMsg(on ? "Läuft auf dem Fernseher. Kanal- und Sendungstasten steuern jetzt den Fernseher." +
               (skipped ? ` ${skipped} Sendungen von YouTube/Dailymotion sind ausgeblendet, weil sie sich nicht direkt übertragen lassen.` : "")
             : "");
  refresh();
}
async function castPlay(it, offset, key) {
  clearPlayer(); osd(`📡 Auf dem Fernseher
${it.title}`);
  try {
    const url = await mediaUrl(it);
    if (state.playingKey !== key) return;
    const mi = new chrome.cast.media.MediaInfo(url, mimeOf(url));
    mi.metadata = new chrome.cast.media.GenericMediaMetadata();
    mi.metadata.title = it.title;
    mi.metadata.subtitle = `${CHANNELS[state.chan].name} · ${it.year || ""} · Röhrenkiste`;
    const req = new chrome.cast.media.LoadRequest(mi);
    req.currentTime = Math.max(0, Math.floor(offset)); req.autoplay = true;
    await cast.framework.CastContext.getInstance().getCurrentSession().loadMedia(req);
  } catch (e) {
    console.warn("Übertragen fehlgeschlagen", e);
    osd(`📡 Bildstörung
„${it.title}“ ließ sich nicht übertragen. ⏭ für die nächste.`, true);
  }
}
$("cast").onclick = async () => {
  if (state.casting) { cast.framework.CastContext.getInstance().endCurrentSession(true); return; }
  if (castReady) {
    state.on = true;
    try { await cast.framework.CastContext.getInstance().requestSession(); }
    catch (e) { if (e !== "cancel") castMsg("Kein Fernseher verbunden. Handy und Fernseher müssen im selben WLAN sein."); }
    return;
  }
  const v = $("player").querySelector("video");
  if (v && v.remote) { v.remote.prompt().catch(() => castMsg("Kein Fernseher gefunden.")); return; }
  const c = current();
  castMsg(c && (c.it.src === "yt" || c.it.src === "dm")
    ? "Diese Sendung läuft über einen fremden Player. Tippe oben rechts im Bild auf das Quellen-Schild und übertrage dort aus der App."
    : "Übertragen klappt nur in Chrome (Android oder Computer) mit einem Chromecast oder Google-TV-Gerät im selben WLAN.");
};

function current() {
  if (!state.items.length) return null;
  if (state.live) { const s = liveAt(now()); return { it: state.items[s.i], i: s.i, start: s.start, offset: s.offset, key: "L" + s.i + "@" + s.start }; }
  const i = ((state.pIndex % state.items.length) + state.items.length) % state.items.length;
  return { it: state.items[i], i, start: null, offset: 0, key: "P" + i };
}

function refresh() {
  $("led").textContent = String(state.chan + 1).padStart(2, "0");
  $("led").classList.toggle("live", state.on && state.live);
  $("power").textContent = state.on ? "AUS" : "AN"; $("power").classList.toggle("on", state.on);
  const c = current();
  if (!state.on) { clearPlayer(); osd("Jahrzehnt und Kanal wählen, dann AN tippen"); state.playingKey = null; }
  else if (!c && state.loading) { if (state.playingKey !== "load") { clearPlayer(); state.playingKey = "load";
      osd(`Suche läuft …\n${CHANNELS[state.chan].name} · ${dec().label}`); } }
  else if (!c) { if (state.playingKey !== "none") { clearPlayer(); state.playingKey = "none";
      osd(`Sendepause\nAuf „${CHANNELS[state.chan].name}“ wurde für die ${dec().label} nichts gefunden.`, true); } }
  else if (c.key !== state.playingKey) play(c.it, c.offset, c.key);

  if (c) {
    $("title").textContent = c.it.title;
    const parts = [c.it.year || "Jahr unbekannt", srcName[c.it.src]];
    if (c.start) parts.unshift(`${hhmm(c.start)} – ${hhmm(c.start + c.it.duration)}`);
    if (!state.live) parts.unshift("Eigene Auswahl");
    if (c.it.src === "dm" || c.it.src === "yt" || c.it.src === "pt") parts.push("Bild bleibt leer? ⏭ drücken oder Quelle abwählen");
    $("meta").textContent = parts.join(" · ");
    $("prog").max = c.it.duration; $("prog").value = state.live ? c.offset : 0;
    $("star").classList.toggle("on", favs().some(f => f.src === c.it.src && f.id === c.it.id));
  } else { $("title").textContent = "Kein Programm"; $("meta").textContent = state.on ? "Sendepause" : "Bereit"; $("prog").value = 0; }
  renderGuide(c);
}

function renderGuide(c) {
  const L = state.items;
  if (!L.length) { $("guide").innerHTML = `<tr><td>Noch nichts gefunden.</td></tr>`; return; }
  let t = c && c.start ? c.start : null, rows = [];
  for (let k = 0; k < Math.min(10, L.length); k++) {
    const i = ((c ? c.i : 0) + k) % L.length, it = L[i];
    rows.push(`<tr class="${k === 0 ? "cur" : ""}"><td class="t">${t ? hhmm(t) : k === 0 ? "jetzt" : ""}</td>
      <td>${esc(it.title)}<br><small style="color:var(--muted)">${it.year || "Jahr ?"}${it.est ? " · Länge geschätzt" : ""}</small></td>
      <td class="s">${srcName[it.src]}</td></tr>`);
    if (t) t += it.duration;
  }
  $("guide").innerHTML = rows.join("");
}

/* ---------- Bedienung ---------- */
function chips(el, list, isOn, onPick) {
  el.innerHTML = "";
  list.forEach((x, i) => {
    const b = document.createElement("button"); b.className = "chip" + (isOn(x, i) ? " on" : "");
    b.textContent = x.label; b.onclick = () => { onPick(x, i); renderControls(); }; el.appendChild(b);
  });
}
function renderControls() {
  chips($("decades"), DECADES, d => d.id === state.decade, d => { state.decade = d.id; store.set("decade", d.id); switchTo(); });
  chips($("chans"), CHANNELS.map((c, i) => ({ label: `${i + 1} ${c.name}` })), (_, i) => i === state.chan, (_, i) => setChan(i));
  chips($("langs"), LANGS, l => l.id === state.lang, l => { state.lang = l.id; store.set("lang", l.id); switchTo(); });
  $("sources").innerHTML = SOURCES.map(s => `<label><input type="checkbox" data-s="${s.id}" ${state.sources[s.id] ? "checked" : ""}> ${s.label}</label>`).join("");
}
$("sources").onchange = e => { const s = e.target.dataset.s; if (!s) return; state.sources[s] = e.target.checked; store.set("sources3", state.sources); switchTo(); };
$("dmplayer").value = state.dmPlayer;
$("dmplayer").onchange = e => { state.dmPlayer = e.target.value; store.set("dmPlayer", state.dmPlayer); state.playingKey = null; refresh(); };
$("strict").checked = state.strict;
$("strict").onchange = e => { state.strict = e.target.checked; store.set("strict", state.strict); switchTo(); };
$("ytkey").value = state.ytkey;
function ytMsg(text, cls) { $("ytmsg").textContent = text; $("ytmsg").className = "keymsg " + (cls || ""); }
if (state.ytkey) ytMsg("✓ Schlüssel gespeichert – YouTube ist aktiv.", "good");
/* Prüft den Schlüssel mit einer Abfrage, die nur 1 Einheit Kontingent kostet. */
async function saveKey() {
  const k = $("ytkey").value.trim();
  if (!k) { state.ytkey = ""; store.set("ytkey", ""); ytMsg("Schlüssel entfernt – YouTube wird übersprungen."); switchTo(); return; }
  ytMsg("Prüfe Schlüssel …");
  try {
    await getJson("https://www.googleapis.com/youtube/v3/videos?part=id&id=jNQXAC9IVRw&key=" + encodeURIComponent(k));
    state.ytkey = k; store.set("ytkey", k);
    if (!state.sources.yt) { state.sources.yt = true; store.set("sources3", state.sources); renderControls(); }
    ytMsg("✓ Schlüssel funktioniert und ist gespeichert – YouTube ist aktiv.", "good");
    switchTo(true);
  } catch (e) {
    const r = e.reason || "";
    ytMsg(/quota/i.test(r) ? "Schlüssel ist gültig, aber das Tageskontingent ist aufgebraucht. Morgen wieder."
        : /referer|blocked|forbidden|ipRefererBlocked/i.test(r) ? "Schlüssel ist für diese Seite gesperrt. In der Google Cloud Console bei „Websites“ " + location.origin + "/* eintragen."
        : /accessNotConfigured|disabled/i.test(r) ? "„YouTube Data API v3“ ist für dieses Projekt nicht aktiviert. In der Google Cloud Console unter „APIs & Dienste → Bibliothek“ aktivieren."
        : e.status === 400 ? "Schlüssel ungültig. Bitte vollständig kopieren (beginnt meist mit „AIza“)."
        : "Prüfung fehlgeschlagen (" + (e.status || "keine Verbindung") + (r ? ", " + r : "") + ").", "bad");
  }
}
$("ytsave").onclick = saveKey;
$("ytkey").onkeydown = e => { if (e.key === "Enter") saveKey(); };

function switchTo(force) { state.live = true; state.items = []; state.all = []; state.playingKey = null; refresh(); loadChannel(force); }
function setChan(i) { state.chan = (i + CHANNELS.length) % CHANNELS.length; store.set("chan", state.chan); renderControls(); switchTo(); }
function step(n) { const c = current(); if (!c) return; state.live = false; state.pIndex = c.i + n; state.playingKey = null; refresh(); }

$("power").onclick = () => { state.on = !state.on; state.playingKey = null; refresh(); };
$("chup").onclick = () => setChan(state.chan + 1);
$("chdown").onclick = () => setChan(state.chan - 1);
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);
$("live").onclick = () => { state.live = true; state.playingKey = null; refresh(); };
$("reloadKey").onclick = () => switchTo(true);
$("full").onclick = () => { const s = $("screen"); (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s); };
$("star").onclick = () => {
  const c = current(); if (!c) return;
  let f = favs(); const i = f.findIndex(x => x.src === c.it.src && x.id === c.it.id);
  if (i >= 0) f.splice(i, 1); else f.push(c.it);
  store.set("favs", f); refresh();
};
$("screen").onclick = e => { const v = $("player").querySelector("video"); if (v && v.paused) v.play().catch(() => {}); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowUp") setChan(state.chan + 1);
  if (e.key === "ArrowDown") setChan(state.chan - 1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

setInterval(() => {
  $("clock").textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (state.on || state.items.length) refresh();
}, 1000);

renderControls();
switchTo();
if (window.__castPending) initCast();
</script>
</body>
</html>
